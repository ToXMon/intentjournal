name: Build and Push to GHCR

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: toxmon/intentjournal-plus

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_PARA_API_KEY=${{ secrets.NEXT_PUBLIC_PARA_API_KEY }}
            NEXT_PUBLIC_PARA_SECRET_KEY=${{ secrets.NEXT_PUBLIC_PARA_SECRET_KEY }}
            NEXT_PUBLIC_VENICE_API_KEY=${{ secrets.NEXT_PUBLIC_VENICE_API_KEY }}
            NEXT_PUBLIC_ALCHEMY_KEY=${{ secrets.NEXT_PUBLIC_ALCHEMY_KEY }}
            NEXT_PUBLIC_ALCHEMY_API_KEY_BASE=${{ secrets.NEXT_PUBLIC_ALCHEMY_API_KEY_BASE }}
            NEXT_PUBLIC_PRIVY_APP_ID=${{ secrets.NEXT_PUBLIC_PRIVY_APP_ID }}
            NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID=${{ secrets.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID }}
            NEXT_PUBLIC_ETHERLINK_ESCROW_ADDRESS=${{ secrets.NEXT_PUBLIC_ETHERLINK_ESCROW_ADDRESS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
